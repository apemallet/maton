steps = 16
learning_rate = 0.0001
checkpoint_every = 8

[ppo]
num_envs = 1
rollout_steps = 4
epochs = 1
minibatch_size = 4
hidden_size = 8

[evaluations.level-1]
checkpoint = "final"
level = 1
seed = 1000
episodes = 1
render = [0]
