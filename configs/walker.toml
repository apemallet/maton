# Walking training job. The original small torque job is basic.toml.
seed = 0
curriculum = "curricula/walker.toml"

[env]
timestep = 0.01
frame_skip = 4
episode_length = 512
lidar_count = 9
lidar_range = 3.0
reset_noise = 0.01
progress_scale = 20.0
progress_mode = "upright"
control_cost = 0.0001
control_mode = "position"
upright_reward = 0.1
finish_reward = 25.0
foot_length = 0.16
hip_target_min = -0.8
hip_target_max = 0.8
hip_target_neutral = 0.0
knee_target_min = -0.08
knee_target_max = 1.3
knee_target_neutral = 0.0

[training]
# Actual environment transitions, summed over parallel environments.
steps = 524_288
learning_rate = 0.0003
checkpoint_every = 8_192

[ppo]
num_envs = 16
rollout_steps = 128
epochs = 4
minibatch_size = 256
hidden_size = 64
initial_std = 0.2
gamma = 0.99
entropy_coefficient = 0.0

[dreamer]
batch_size = 4
batch_length = 16
train_every = 4
replay_size = 32768
hidden = 64
deter = 128
stoch = 8
classes = 8
imag_length = 15
policy_minstd = 0.03
policy_maxstd = 0.3
optimizer_warmup = 1000
learning_rate = 1e-4  # overrides [training]; upstream default is 4e-5
platform = "cpu"
