# Tiny development run; increase budgets only after inspecting saved episodes.
seed = 0

[env]
timestep = 0.01
frame_skip = 2
episode_length = 256
lidar_count = 9
lidar_range = 3.0
reset_noise = 0.01
progress_scale = 1.0
control_cost = 0.001

[terrain]
slots = 10
spacing = 1.5
start_length = 2.0
# Probabilities per slot; together must be <= 1.
block_frequency = 0.2
block_height = 0.12
block_width = 0.35
gap_frequency = 0.1
gap_height = 0.15
gap_width = 0.3

[ppo]
updates = 4
num_envs = 2
rollout_steps = 32
epochs = 2
minibatch_size = 32
hidden_size = 64
learning_rate = 0.0003
checkpoint_every = 1

[dreamer]
steps = 128
batch_size = 1
batch_length = 8
train_every = 16
replay_size = 2048
hidden = 32
deter = 64
stoch = 4
classes = 4
imag_length = 5
learning_rate = 0.0001
checkpoint_every = 64
platform = "cpu"
